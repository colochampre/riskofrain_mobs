architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
}

// riskofrain_items is an optional dependency, not published yet: compile against its local Fabric jar.
// Loom remaps it to the named mappings. It is compile-only: never bundled and never a runtime requirement.
def itemsJar = rootProject.file('fabric/libs/riskofrain_items-fabric-2.1.0.jar')
if (!itemsJar.exists()) {
    throw new GradleException("Missing ${itemsJar}. Build riskofrain_items (./gradlew build in its repo) and copy " +
            "fabric/build/libs/riskofrain_items-fabric-2.1.0.jar to fabric/libs/ and " +
            "forge/build/libs/riskofrain_items-forge-2.1.0.jar to forge/libs/. See README, Building.")
}
dependencies {
    modCompileOnly files(itemsJar)
}
